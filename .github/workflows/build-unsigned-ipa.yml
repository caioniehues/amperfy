# Builds an unsigned Amperfy.ipa for sideloading.
# The .ipa is re-signed and installed from Linux with `xtool install`
# (omarchy-apple-dev), so this job turns code signing off entirely.
name: Build unsigned IPA

on:
  push:
    branches: [replaygain]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Intel pool: the arm64 macOS pool had no capacity (2026-11-19, job never acquired).
    runs-on: macos-26-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          # README asks for Xcode 26; take the newest 26.x, else the newest installed.
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$xcode" ] || xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Build (iphoneos, unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Amperfy.xcodeproj \
            -scheme Amperfy \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || true
          grep -E '(error:|BUILD (SUCCEEDED|FAILED))' build.log | tail -40 || true
          # The app folder survives a failed build (partial products), so it proves nothing:
          # require xcodebuild's own success line and no compiler errors.
          grep -q '\*\* BUILD SUCCEEDED \*\*' build.log
          if grep -q ' error: ' build.log; then echo "compiler errors in build.log"; exit 1; fi
          test -d build/Build/Products/Debug-iphoneos/Amperfy.app

      - name: Package .ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Debug-iphoneos/Amperfy.app Payload/
          zip -qry Amperfy.ipa Payload
          ls -la Amperfy.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Amperfy-unsigned-ipa
          path: Amperfy.ipa
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
          retention-days: 14

  lint:
    # SwiftFormat only rewrites files during the Xcode build; this fails on style instead,
    # for every Swift file this branch changes compared with upstream.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: swiftformat --lint (changed files)
        run: |
          swift --version
          git remote add upstream https://github.com/BLeeEZ/amperfy.git
          git fetch -q upstream master
          mapfile -t files < <(git diff --name-only --diff-filter=d upstream/master...HEAD -- '*.swift')
          if [ ${#files[@]} -eq 0 ]; then echo "no changed Swift files"; exit 0; fi
          printf '%s\n' "${files[@]}"
          swift build -c release --package-path BuildTools --product swiftformat
          "$(swift build -c release --package-path BuildTools --show-bin-path)/swiftformat" \
            --lint --config .swiftformat "${files[@]}"

  changes:
    # The simulator test job takes ~40 min on Intel: run it only when tested code changed.
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.diff.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          before='${{ github.event.before }}'
          if [ '${{ github.event_name }}' != push ] || ! git cat-file -e "$before" 2>/dev/null; then
            echo "tests=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$before" HEAD | grep -qE '^(AmperfyKit/|AmperfyKitTests/|\.github/workflows/)'; then
            echo "tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "tests=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    # Unit tests of the fork's own changes, on an iOS simulator.
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: macos-26-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$xcode" ] || xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Pick an iPhone simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          sims = [s for rt, ds in sorted(d.items(), reverse=True) if "iOS" in rt for s in ds if s["name"].startswith("iPhone")]
          print(sims[0]["udid"])')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$udid"

      - name: Run ReplayGain tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Amperfy.xcodeproj \
            -scheme Amperfy \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:AmperfyKitTests/ReplayGainTest \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log | grep -E "(Test Case|error:|TEST (SUCCEEDED|FAILED)|Executed)" || true
          grep -q "TEST SUCCEEDED" test.log
          # An -only-testing selector that matches nothing still "succeeds": require real tests.
          grep -Eq "Executed [1-9][0-9]* tests?, with 0 failures" test.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-log
          path: test.log
          retention-days: 14
