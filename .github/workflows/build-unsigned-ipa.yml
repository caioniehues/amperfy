# Builds an unsigned Amperfy.ipa for sideloading.
# The .ipa is re-signed and installed from Linux with `xtool install`
# (omarchy-apple-dev), so this job turns code signing off entirely.
name: Build unsigned IPA

on:
  push:
    branches: [replaygain]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Intel pool: the arm64 macOS pool had no capacity (2026-11-19, job never acquired).
    runs-on: macos-26-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          # README asks for Xcode 26; take the newest 26.x, else the newest installed.
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$xcode" ] || xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Build (iphoneos, unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Amperfy.xcodeproj \
            -scheme Amperfy \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E '(error|warning: .*ReplayGain|BUILD (SUCCEEDED|FAILED))' || true
          test -d build/Build/Products/Debug-iphoneos/Amperfy.app

      - name: Package .ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Debug-iphoneos/Amperfy.app Payload/
          zip -qry Amperfy.ipa Payload
          ls -la Amperfy.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Amperfy-unsigned-ipa
          path: Amperfy.ipa
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
          retention-days: 14

  test:
    # Unit tests of the fork's own changes, on an iOS simulator.
    runs-on: macos-26-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$xcode" ] || xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Pick an iPhone simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          sims = [s for rt, ds in sorted(d.items(), reverse=True) if "iOS" in rt for s in ds if s["name"].startswith("iPhone")]
          print(sims[0]["udid"])')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$udid"

      - name: Run ReplayGain tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Amperfy.xcodeproj \
            -scheme Amperfy \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:AmperfyTests/ReplayGainTest \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log | grep -E "(Test Case|error:|TEST (SUCCEEDED|FAILED)|Executed)" || true
          grep -q "TEST SUCCEEDED" test.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-log
          path: test.log
          retention-days: 14
